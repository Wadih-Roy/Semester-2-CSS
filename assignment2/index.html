<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is week 2 example code">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js.js"></script>
    <title>Home</title>
    <!-- Google Fonts -->
    <!-- FONT 1 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Sriracha&display=swap" rel="stylesheet">
    <!-- Font 2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <div>
        <a href="index.html"><img src="./img/jelly-beans-high-resolution-logo.png" alt="logo"></a>
    </div>
    <nav>
        <menu>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">About Us</a></li>
        </menu>
    </nav>
</header>
<main>
    <section class="masthead">
            <pre><div class="text">  JELLY JOLLY  </div></pre>
    </section>
    <section class="sec1">
        <div class="textmix">FLAVORS</div>
    </section>
    <div class="img">
        <img src="./img/bag1.png" alt="bag1" class="slide-right">
        <img src="./img/bag2.png" alt="bag2" class="slide-down">
        <img src="./img/bag3.png" alt="bag3" class="slide-down">
        <img src="./img/bag4.png" alt="bag4" class="slide-left">
    </div>
    <section class="sec2">
        <div class="sourtxt">SOURS</div>
    </section>
    <div class="img">
            <img src="./img/sourbag1.png" alt="sourbag1" class="slide-right">
            <img src="./img/sourbag2.png" alt="sourbag2" class="slide-left">
    </div>
    <section class="sec3">
        <div class="bluetxt">BLUES</div>
    </section>
    <div class="img">
        <img src="./img/bluebag2.png" alt="bluebag2" class="slide-right">
        <img src="./img/bluebag3.png" alt="bluebag3" class="slide-left">
    </div>
    <section class="sec4">
        <div class="purpletxt">PURPLES</div>
    </section>
    <div class="img">
        <img src="./img/purplebag2.png" alt="purplebag2" class="slide-right">
        <img src="./img/pruplebag3.png" alt="purplebag3" class="slide-left">
    </div>
</main>
<footer>
    <label>
        <input type="text" placeholder="Name">
    </label>
    <label>
        <input type="text" placeholder="Email">
    </label>
    <label>
        <input type="text" placeholder="Comment">
    </label>
</footer>
</body>
</html>
